[include]
files = ["noctalia.toml"]                                      # Example: ["appearance.toml", "outputs.toml"]

[include.optional]
files = []

# ==============================================================================
# General

[general]
autostart = [
            "noctalia",
            "steam -silent -minimized",
            "netbird-ui",
            "kDrive",
            "signal-desktop",
            "firefox --new-window https://www.duckduckgo.com",
            "kitty -e /home/gcn/.local/bin/greeter.sh",
            "umbriel msg \"workspace-switch:TERMINAL/DP-3\""
            ]

# ==============================================================================
# Outputs

# mod_key = "Super"                             # Force Super instead of nested-session Alt
xwayland = true                                 # Requires xwayland-satellite; restart to change
show_cheatsheet = false                         # Show the keybind overlay on startup
focus_on_activate = true                       # Do not let unsolicited requests steal focus
honor_restored_maximize = false                 # Honor restored maximized state


[output.HDMI-A-1]
enabled = true                                # False removes the output but preserves its state
mode = "1920x1080@60.000"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
position = [0, 0]                             # Logical top-left; omit for automatic placement
scale = 1.00                                  # Logical size is mode size divided by scale
# transform = "normal"                          # normal, 90, 180, 270, or a flipped variant
# vrr = "fullscreen"                            # disabled, always, or fullscreen
# tearing = true                                # Permit eligible fullscreen asynchronous flips
# direct_scanout = true                         # False forces composition on this output
# hdr = "auto"                                  # off, on, auto, or fullscreen
# sdr_white = 203                               # SDR reference white in cd/m2 during HDR
# workspaces = 5                                # Anonymous fixed positions; omit for dynamic
# workspace_axis = "horizontal"                 # vertical or horizontal workspace arrangement

#[output."AOC U34G2G4R3 0x000019A2"]
[output.DP-3]
enabled = true                                # False removes the output but preserves its state
mode = "3440x1440@99.982"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
position = [1920, -180]                             # Logical top-left; omit for automatic placement
scale = 1.00                                  # Logical size is mode size divided by scale
# transform = "normal"                          # normal, 90, 180, 270, or a flipped variant
# vrr = "fullscreen"                            # disabled, always, or fullscreen
# tearing = true                                # Permit eligible fullscreen asynchronous flips
direct_scanout = true                        # False forces composition on this output
hdr = "auto"                                  # off, on, auto, or fullscreen
# sdr_white = 203                               # SDR reference white in cd/m2 during HDR
workspaces = ["BROWSER", "TERMINAL", "GAMING","MUSIC", "DATEN", "REMOTE", "SONST"]                                # Anonymous fixed positions; omit for dynamic
# workspace_axis = "horizontal"                 # vertical or horizontal workspace arrangement

#[output."Samsung Electric Company LF24T450F HK7W201363"]
[output.DP-2]
 enabled = true                                # False removes the output but preserves its state
 mode = "1920x1080@74.973"                        # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ
 position = [5360, -650]                             # Logical top-left; omit for automatic placement
 scale = 1.00                                  # Logical size is mode size divided by scale
 transform = "90"                          # normal, 90, 180, 270, or a flipped variant
# vrr = "fullscreen"                            # disabled, always, or fullscreen
# tearing = true                                # Permit eligible fullscreen asynchronous flips
# direct_scanout = true                         # False forces composition on this output
# hdr = "auto"                                  # off, on, auto, or fullscreen
# sdr_white = 203                               # SDR reference white in cd/m2 during HDR
workspaces = ["CHAT","LESEN"]                  # Anonymous fixed positions; omit for dynamic
workspace_axis = "horizontal"       # vertical or horizontal workspace arrangement


[appearance.blur]
radius = 3                                      # Blur radius, 0-100

# ──────────────────────────────── Input ─────────────────────────────────────

[input]
middle_click_paste = true                       # Primary-selection paste; applies on reload
window_drag_toggle = "none"                     # none, floating, or pinned when pressing the other drag button

[input.keyboard]
layout = "de"                                     # Example: "us,de"; empty uses the system default
variant = ""                                    # Example: ",nodeadkeys" for two layouts
options = ""                                    # Example: "grp:alt_shift_toggle"
repeat_rate = 25                                # Key repeats per second, 0-1000
repeat_delay = 600                              # Delay before repeating, 0-10000 ms
numlock_toggle = true                           # Enable on connect; false preserves the current state
track_layout = "global"                         # global, or window to remember each window's keyboard layout

[input.touchpad]
tap = false                              # Tap-to-click

[input.cursor]
theme = "Bibata-Modern-Ice"                     # Empty uses environment or default Xcursor theme
size = 24                                       # Logical size, 1-512
hardware_cursor = true                          # False forces cursor composition
follows_focus = true                          # Warp to windows selected by focus, output, move, or other activations
hide_when_typing = true                        # Keep visible while typing
hide_timeout_ms = 0                            # Idle hide timeout, 0 disables; maximum is 3600000

[input.focus]
follows_mouse = false                           # Focus on motion after scene changes, client fullscreen exits, and closes

# ──────────────────────────────── Keybinds ─────────────────────────────────────

[keybinds]

# screenshots
"Print" = "spawn:noctalia msg screenshot-region"

"Mod+Tab" = "spawn:noctalia msg window-switcher"

# Session
"Mod+Escape" = "session-quit:skip-confirmation"
"pause" = "dpms-off"
"Ctrl+pause" = "dpms-on"

# Applications
"Mod+Return" = "spawn:kitty"
"Ctrl+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Space" = "spawn:rofi -show drun"
"Mod+Q" = "window-close"
"Mod+B" = "spawn:firefox --new-window https://www.faxxxmaster.cc"
"Mod+Ctrl+B" = "spawn:helium-browser"
"Ctrl+B" = "spawn:firefox"
"Mod+E" = "spawn:vscodium"
"Mod+D" = "spawn:nemo"
"Mod+P" = "spawn:Plex --platform xcb"
"Mod+X" = "spawn:sh -c 'zapzap & sleep 1 && vesktop discord://discord.com/channels/1401598189823590460/1401607794414850120'"
"Mod+G" = "spawn:steam"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+N" ="spawn:kitty -e micro /home/gcn/.config/umbriel/config.toml"
"Mod+L" = "spawn:noctalia msg session lock && notify-send 'Session locked'"


"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Down" = "workspace-next"
"Mod+Up" = "workspace-previous"


"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"

"Mod+Shift+Up" = "window-move-to-workspace-previous"
"Mod+Shift+Down"= "window-move-to-workspace-next"


"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }

"Mod+Ctrl+right" = "output-focus-next"
"Mod+Ctrl+left" = "output-focus-previous"

# Window state and layout
"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+Ctrl+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize-to-edges"

# Overview
"Ctrl+Tab" = { action = "overview-toggle", repeat = false }
"Mod+Ctrl+F" = "window-toggle-fullscreen"             # Exit restores the previous layout size immediately
"Mod+F" = "window-toggle-maximize"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"

# Workspaces. Bare digits are positions on the output under the pointer.
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

"Mod+Ctrl+S" = "window-move-to-scratchpad"
"Mod+S" = "scratchpad-toggle"
"Alt+S" = "window-restore-from-scratchpad"
"Alt+Tab" = "scratchpad-focus-next"
 "Mod+C" = "column-center"
 "Mod+Shift+C" = "window-center"

 "Ctrl+WheelUp" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+"
 "Ctrl+WheelDown" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"


# ──────────────────────────────── Layout  ─────────────────────────────────────


[layout]
mode = "scrolling"                              # scrolling, dwindle, or master
gap = 4                                       # Logical pixels between tiles, 0-500
extent_presets = [0.333, 0.5, 0.667]             # Primary and secondary extent fractions

[layout.struts]
left = 0                                        # -65535 to 65535
right = 0
top = 0
bottom = 0

[layout.scrolling]
default_extent_fraction = 0.5                   # Initial extent for new columns, 0.1-1.0
center_underfull_strip = true                   # Center a strip narrower than the viewport
center_focused = "never"                        # never, always, or on_overflow


# ───────────────────────────── Window Rules ─────────────────────────────────

[[window_rule]]
blur = true
blur_optimized = false

# Noctalia settings
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1500, height = 1000 }
# opacity = 0.9

# Noctalia share picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }


# Float common browser Picture-in-Picture windows near the bottom-right corner.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_pinned = true
default_position = { x = 20, y = 20, anchor = "bottom_right" }


[[window_rule]]
match.app_id = "^firefox$"
match.title = "^Bild-im-Bild$"
default_floating = true
default_pinned = true
default_position = { x = 10, y = 10, anchor = "top_right" }


[[window_rule]]
match.app_id = "^mpv$"
default_floating = true
default_pinned = true
default_position = { x = 10, y = 10, anchor = "top_right" }

[[window_rule]]
match.app_id = "^fladder$"
default_floating = true
default_pinned = true
default_position = { x = 10, y = 10, anchor = "top_right" }
default_output = "HDMI-A-1"


[[window_rule]]
match.app_id = "^(steam_app_[0-9]+|gamescope)$"
vrr = "fullscreen"
default_maximize = true


[[window_rule]]
match.app_id = "^com\\.rtosta\\.zapzap$"
default_output = "DP-2"
default_workspace = "CHAT"
default_scrolling_extent = 0.4


[[window_rule]]
match.app_id = "^vesktop$"
default_output = "DP-2"
default_workspace = "CHAT"
default_scrolling_extent = 0.6


[[window_rule]]
match.app_id = "^firefox$"
match.title = "DuckDuckGo"
default_output = "DP-3"
default_workspace = "BROWSER"


[[window_rule]]
match.app_id = "^kitty$"
match.title = "^greeter\\.sh$"
default_output = "DP-3"
default_workspace = "TERMINAL"


[[window_rule]]
match.app_id = "^steam$"
default_output = "DP-3"
default_workspace = "GAMING"


[[window_rule]]
match.app_id = "^Spotify$"
default_output = "DP-3"
default_workspace = "MUSIC"


[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true


[[window_rule]]
match.is_focused = false
opacity = 0.65


[[window_rule]]
match.is_focused = true
opacity = 0.85

[[window_rule]]
match.is_floating = true
match.is_scratchpad = false
blur = true

[[window_rule]]
match.app_id = "^Plex$"
default_output = "HDMI-A-1"
default_maximize = true
opacity = 1.0


[[window_rule]]
match.app_id = "^mpv$"
opacity = 1.0


[[window_rule]]
match.app_id = "^Fladder$"
opacity = 1.0


[[window_rule]]
match.app_id = "^vesktop$"
match.is_focused = true
opacity = 0.8

[[window_rule]]
match.app_id = "^vesktop$"
match.is_focused = false
opacity = 0.7

[[window_rule]]
match.app_id = "^com\\.rtosta\\.zapzap$"
match.is_focused = true
opacity = 0.6

[[window_rule]]
match.app_id = "^com\\.rtosta\\.zapzap$"
match.is_focused = false
opacity = 0.6

[[window_rule]]
match.app_id = "^(firefox|helium)$"
match.is_focused = true
opacity = 1.0

[[window_rule]]
match.app_id = "^(firefox|helium)$"
match.is_focused = false
opacity = 0.8

# 75% width when the window is alone, the default width when another window opens.
[[window_rule]]
match.is_alone = true
default_scrolling_extent = 0.75

# ────────────────────────────── Layer Rules ─────────────────────────────────

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ────────────────────────────── Animation ───────────────────────────────────

# Window opening animation
[animation.windows_in]
enabled = true
curve = "spring:1,1900"                         # 278 ms critically damped settle
style = "popin"                                 # popin, zoom, slide, fade, or none
scale = 0.85                                    # Popin start scale, 0.1-1.0
# shader = "shaders/reveal.glsl"      # Replaces the built-in opening style

# Window closing animation
[animation.windows_out]
enabled = true
curve = "spring:1,900"                          # 403 ms critically damped settle
style = "fade"                                  # fade, slide, popin, or zoom
scale = 0.8                                     # Popin end scale, 0.1-1.0
# shader = "shaders/reveal.glsl"

# scratchpad resizing
[animation.windows_move]
enabled = true
curve = "spring:1,4400"                         # 183 ms critically damped settle
# shader = "shaders/squash.glsl"      # Subtle compression and settle during move/resize


# ─────────────────────── Overview and Hot Corners ───────────────────────────

[overview]
zoom = 0.2                                      # Workspace scale in overview, 0.1-0.75
background_blur = true                        # Blur the wallpaper behind overview rows
workspace_wallpaper = true                    # Mirror wallpapers inside workspace previews
shortcuts = true                              # Show keyboard shortcut badges on windows
shortcut_keys = "1234567890"                  # Badge keys in preference order

[hot_corners.top_left]
enabled = true                                  # Open the overview after resting here
delay_ms = 500                                  # 0 activates immediately; maximum is 10000
action = "overview-open"                        # Any normal Umbriel action is accepted

